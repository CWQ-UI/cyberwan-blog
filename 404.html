<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>页面走丢了 · @CyberWan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px;
      background:
        radial-gradient(ellipse at 20% 0%, rgba(37, 99, 235, 0.08), transparent 42%),
        #f7f6f2;
      color: #191b21;
      font-family: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { width: min(520px, 100%); text-align: center; }
    .mark {
      display: inline-grid;
      place-items: center;
      width: 54px;
      height: 54px;
      border-radius: 15px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.03em;
      box-shadow: 0 10px 28px rgba(37, 99, 235, 0.22);
    }
    .code {
      margin: 28px 0 8px;
      color: #2563eb;
      font-size: 72px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.06em;
    }
    h1 { margin: 0; font-size: 28px; letter-spacing: -0.04em; }
    p { margin: 12px auto 30px; max-width: 380px; color: #5b6470; font-size: 14px; line-height: 1.8; }
    .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 18px;
      border: 1px solid #e5e2d9;
      border-radius: 10px;
      background: #fff;
      color: #191b21;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 1px 2px rgba(25, 27, 33, 0.04);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    a:hover { transform: translateY(-1px); border-color: #d7d2c6; }
    a.primary { border-color: #191b21; background: #191b21; color: #fff; }
    .hint { margin-top: 28px; color: #8a919b; font-size: 11px; }
    @media (prefers-color-scheme: dark) {
      body { background: radial-gradient(ellipse at 20% 0%, rgba(138, 180, 255, 0.1), transparent 42%), #0e1015; color: #f2f5fa; }
      h1 { color: #f2f5fa; }
      p { color: #9ba4b2; }
      a { border-color: #262b35; background: #171a21; color: #f2f5fa; }
      a.primary { border-color: #8ab4ff; background: #8ab4ff; color: #0e1015; }
      .hint { color: #78818f; }
    }
  </style>
</head>
<body>
  <main>
    <span class="mark">CW</span>
    <div class="code">404</div>
    <h1>这条路径通向虚空。</h1>
    <p>你要找的页面可能被移动、删除，或者从来没有存在过。回到首页，继续读点别的。</p>
    <div class="actions">
      <a class="primary" href="index.html">返回首页</a>
      <a href="index.html#journal">浏览文章</a>
    </div>
    <p class="hint">@CyberWan · 个人博客</p>
  </main>
</body>
</html>
